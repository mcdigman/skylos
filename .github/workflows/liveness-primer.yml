name: Analyzer Blast Radius

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skylos/**"
      - "pyproject.toml"
      - "MANIFEST.in"
      - ".github/workflows/liveness-primer.yml"

permissions:
  contents: read

env:
  LIVENESS_PRIMER_REF: 4d1b5c391c040d95cdd5f47ebc09798196265135

concurrency:
  group: liveness-primer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  blast-radius:
    name: Python dead-code blast radius
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out pinned liveness_primer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mcdigman/liveness_primer
          ref: ${{ env.LIVENESS_PRIMER_REF }} # main
          path: _liveness_primer
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: "3.13"
          enable-cache: false

      - name: Compute exact container cache key
        id: container-cache-key
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          for revision in "$BASE_SHA" "$MERGE_SHA" "$LIVENESS_PRIMER_REF"; do
            if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Invalid cache-key revision" >&2
              exit 1
            fi
          done

          docker_identity="docker $(docker version --format '{{.Server.Version}}')"
          docker_hash="$(printf '%s' "$docker_identity" | sha256sum | cut -d ' ' -f 1)"
          cache_key="liveness-primer-container-pair-v1-${RUNNER_OS}-${RUNNER_ARCH}-${docker_hash}-${LIVENESS_PRIMER_REF}-${BASE_SHA}-${MERGE_SHA}"
          printf 'key=%s\n' "$cache_key" >> "$GITHUB_OUTPUT"

      - name: Restore exact container environments
        id: container-image-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/liveness-primer-image-cache/pair.tar
          key: ${{ steps.container-cache-key.outputs.key }}

      - name: Load cached container environments
        if: steps.container-image-cache.outputs.cache-hit == 'true'
        env:
          IMAGE_ARCHIVE: ${{ runner.temp }}/liveness-primer-image-cache/pair.tar
        shell: bash
        run: |
          set -euo pipefail

          if [[ -L "$IMAGE_ARCHIVE" || ! -f "$IMAGE_ARCHIVE" ]]; then
            echo "Cached container archive is not a regular file" >&2
            exit 1
          fi
          docker load --input "$IMAGE_ARCHIVE"

      - name: Compare base with the pull request merge result
        env:
          SKYLOS_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # The base repository owns this synthetic merge commit, including
          # for fork PRs, so the comparison tests what would actually land.
          MERGE_SHA: ${{ github.sha }}
          REPORT_JSON: liveness-primer-report.json
          REPORT_MARKDOWN: liveness-primer-report.md
        shell: bash
        run: |
          set -euo pipefail

          for revision in "$BASE_SHA" "$MERGE_SHA"; do
            if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Invalid comparison revision" >&2
              exit 1
            fi
          done

          uv run --project _liveness_primer --locked liveness-primer run \
            --tool skylos \
            --repo "$SKYLOS_REPOSITORY" \
            --old "$BASE_SHA" \
            --new "$MERGE_SHA" \
            --all \
            --container \
            --output github \
            --json-out "$REPORT_JSON" \
            --jobs 2 \
            --timeout 300 \
            | tee "$REPORT_MARKDOWN" >> "$GITHUB_STEP_SUMMARY"

          test -s "$REPORT_JSON"

      - name: Export container environments after a cache miss
        id: export-container-environments
        if: always() && steps.container-image-cache.outputs.cache-hit != 'true'
        env:
          IMAGE_ARCHIVE: ${{ runner.temp }}/liveness-primer-image-cache/pair.tar
          REPORT_JSON: liveness-primer-report.json
        shell: bash
        run: |
          set -euo pipefail

          jq -e '.manifest.isolation_enforced == true and .manifest.comparable == true' "$REPORT_JSON" > /dev/null
          base_fingerprint="$(jq -er '.manifest.base.fingerprint | select(test("^[0-9a-f]{24}$"))' "$REPORT_JSON")"
          head_fingerprint="$(jq -er '.manifest.head.fingerprint | select(test("^[0-9a-f]{24}$"))' "$REPORT_JSON")"
          base_image="liveness-primer/env:${base_fingerprint}"
          head_image="liveness-primer/env:${head_fingerprint}"

          docker image inspect "$base_image" "$head_image" > /dev/null

          cache_dir="$(dirname "$IMAGE_ARCHIVE")"
          if [[ -L "$cache_dir" || ( -e "$cache_dir" && ! -d "$cache_dir" ) ]]; then
            echo "Container cache path is not a regular directory" >&2
            exit 1
          fi
          mkdir -p "$cache_dir"
          if [[ -L "$cache_dir" || ! -d "$cache_dir" ]]; then
            echo "Container cache path is not a regular directory" >&2
            exit 1
          fi

          temporary_archive="${IMAGE_ARCHIVE}.tmp"
          if [[ -e "$temporary_archive" || -L "$temporary_archive" ]]; then
            echo "Temporary container archive path already exists" >&2
            exit 1
          fi
          docker save --output "$temporary_archive" "$base_image" "$head_image"
          mv "$temporary_archive" "$IMAGE_ARCHIVE"

      - name: Save exact container environments
        if: always() && steps.container-image-cache.outputs.cache-hit != 'true' && steps.export-container-environments.outcome == 'success'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/liveness-primer-image-cache/pair.tar
          key: ${{ steps.container-cache-key.outputs.key }}

      - name: Upload blast-radius evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: liveness-primer-report
          path: |
            liveness-primer-report.md
            liveness-primer-report.json
          if-no-files-found: error
          retention-days: 14
