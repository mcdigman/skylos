name: Liveness Primer

# Measures the blast radius of this PR's Skylos changes across the
# liveness_primer corpus. This job runs the PR's own detector code, so it
# holds no write token and never comments: it only uploads the report.
# Liveness Primer Comment consumes that artifact from the default branch.
on:
  pull_request:
    # Deliberately omits `synchronize`. A corpus run is expensive, so the
    # blast radius is measured once, against the commit the PR opened with.
    # Use the Actions "Run workflow" button to re-measure a moved head.
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to re-measure
        required: true

concurrency:
  group: liveness-primer-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

env:
  LIVENESS_PRIMER_REF: main
  PYTHON_VERSION: "3.13"

permissions:
  contents: read

jobs:
  skylos:
    name: Skylos blast radius
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve the pull request under measurement
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          set -euo pipefail
          number=$(printf '%s' "$PR_NUMBER" | tr -dc '0-9')
          test -n "$number"
          gh api "repos/${{ github.repository }}/pulls/$number" \
            --jq '"base=" + .base.sha, "head=" + .head.sha' >> "$GITHUB_OUTPUT"
          printf '%s\n' "$number" > pr-number.txt

      - name: Check out liveness_primer
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: mcdigman/liveness_primer
          ref: ${{ env.LIVENESS_PRIMER_REF }}
          path: _liveness_primer
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
          cache-dependency-glob: _liveness_primer/pyproject.toml

      # The markdown rendering is only useful once it reaches the run
      # Summary page; writing it to a file alone leaves the job log showing
      # raw markdown and the Summary empty. --json-out archives the
      # CI-consumable JSON product from the same corpus run, so the report
      # is not paid for twice. The corpus file ships with the package, so
      # no --corpus override is passed.
      - name: Compare Skylos revisions across the corpus
        run: |
          set -o pipefail
          uvx --from ./_liveness_primer \
            liveness-primer run \
            --tool skylos \
            --repo "${{ github.server_url }}/${{ github.repository }}" \
            --old "${{ steps.pr.outputs.base }}" \
            --new "${{ steps.pr.outputs.head }}" \
            --all \
            --output github \
            --json-out liveness-primer-report.json \
            --jobs 2 \
            --timeout 300 \
            | tee liveness-primer-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload liveness_primer report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: liveness-primer-report
          path: |
            liveness-primer-report.md
            liveness-primer-report.json
            pr-number.txt
          if-no-files-found: error
