name: Liveness Primer Comment

# Posts the Liveness Primer rollup as a sticky PR comment.
#
# This workflow is deliberately separate from the measuring workflow. That
# one executes the pull request's own Skylos code and must never hold a
# write token; this one runs from the default branch, touches no PR code,
# and only reads an artifact. Everything it reads out of that artifact is
# untrusted text: the PR number is reduced to digits before use, and the
# report body is only ever moved by file, never interpolated into a script.
on:
  workflow_run:
    workflows: ["Liveness Primer"]
    types: [completed]

permissions:
  contents: read

jobs:
  comment:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      actions: read
    steps:
      - name: Download the report artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: liveness-primer-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: report

      # The full markdown report exceeds GitHub's 65536-character comment
      # limit at corpus scale, so the comment carries the manifest facts
      # and the Totals section only. The manifest bullets are not
      # decoration: reporting contract §3 requires that a non-comparable or
      # unisolated run never reads as routine, and those signals live above
      # the Totals heading.
      - name: Extract the rollup summary
        id: extract
        env:
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          report=report/liveness-primer-report.md
          test -f "$report"

          number=$(tr -dc '0-9' < report/pr-number.txt | head -c 10)
          test -n "$number"
          echo "pr=$number" >> "$GITHUB_OUTPUT"

          {
            echo '<!-- liveness-primer-summary -->'
            echo "### Liveness primer — blast radius of \`${HEAD_SHA:0:12}\`"
            echo
            if grep -q '^## :warning: Environment delta' "$report"; then
              echo '> [!WARNING]'
              echo '> The run reported an environment delta. See the full report.'
              echo
            fi
            grep -E '^- \*\*(base|head|comparable|isolation)\*\*:' "$report" || true
            echo
            awk '/^## Totals$/{f=1;next} f&&/^## /{exit} f' "$report" | grep -v '^legend:'
            echo
            echo "<sub>Measured when the pull request was opened; later commits are not"
            echo "reflected. <a href=\"$RUN_URL\">Full report and JSON artifact</a>.</sub>"
          } > comment.md

          # A comment that trips the API limit is worse than a trimmed one.
          if [ "$(wc -c < comment.md)" -gt 65000 ]; then
            head -c 64000 comment.md > comment.trimmed
            printf '\n\n<sub>Truncated; see the full report.</sub>\n' >> comment.trimmed
            mv comment.trimmed comment.md
          fi

      # Re-measuring a pull request replaces its summary instead of adding
      # another one, so the thread keeps exactly one current comment.
      - name: Upsert the sticky comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.extract.outputs.pr }}
        run: |
          set -euo pipefail
          existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq 'map(select(.body | startswith("<!-- liveness-primer-summary -->"))) | first | .id // empty')
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@comment.md
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@comment.md
          fi
