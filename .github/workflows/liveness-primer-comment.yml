name: Liveness Primer Comment

# Posts the Liveness Primer rollup as a sticky PR comment.
#
# This workflow is deliberately separate from the measuring workflow. That
# one executes the pull request's own Skylos code and must never hold a
# write token; this one runs from the default branch, touches no PR code,
# and only reads an artifact. Everything it reads out of that artifact is
# untrusted text: the PR number is reduced to digits before use, and the
# report body is only ever moved by file, never interpolated into a script.
on:
  # SKY-D290 flags this trigger because it is the usual way a privileged job
  # ends up running attacker-influenced code. That shape is absent here: this
  # job checks out nothing, executes no repository or pull request code, reads
  # a single artifact strictly as data, and binds the comment target to the
  # measured head SHA before writing. Its only elevated grant is
  # pull-requests: write. Moving the comment into the measuring workflow --
  # the obvious way to drop this trigger -- is strictly worse, because that
  # job does execute the pull request's detector code.
  # skylos: ignore[SKY-D290] privileged job never executes PR-controlled code
  workflow_run:
    workflows: ["Analyzer Blast Radius"]
    types: [completed]

permissions:
  contents: read

jobs:
  comment:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      actions: read
    steps:
      - name: Download the report artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: liveness-primer-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: report

      # The full markdown report exceeds GitHub's 65536-character comment
      # limit at corpus scale, so the comment carries the manifest facts
      # and the Totals section only. The manifest bullets are not
      # decoration: reporting contract §3 requires that a non-comparable or
      # unisolated run never reads as routine, and those signals live above
      # the Totals heading.
      # The pull request number arrives inside an artifact built by a job that
      # ran the pull request's own code, so on its own it is a claim, not a
      # fact: a hostile branch could name someone else's pull request and have
      # its report posted there. Reducing it to digits stops injection but not
      # misdirection, so the claim is only honoured when that pull request's
      # head really is the commit this run measured.
      - name: Bind the comment target to the measured commit
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          number=$(tr -dc '0-9' < report/pr-number.txt | head -c 10)
          test -n "$number"
          claimed=$(gh api "repos/$REPO/pulls/$number" --jq '.head.sha')
          if [ "$claimed" != "$HEAD_SHA" ]; then
            echo "PR #$number head is $claimed, but this run measured $HEAD_SHA" >&2
            exit 1
          fi
          echo "pr=$number" >> "$GITHUB_OUTPUT"

      - name: Extract the rollup summary
        env:
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          report=report/liveness-primer-report.md
          test -f "$report"

          {
            echo '<!-- liveness-primer-summary -->'
            echo "### Liveness primer — blast radius of \`${HEAD_SHA:0:12}\`"
            echo
            if grep -q '^## :warning: Environment delta' "$report"; then
              echo '> [!WARNING]'
              echo '> The run reported an environment delta. See the full report.'
              echo
            fi
            grep -E '^- \*\*(base|head|comparable|isolation)\*\*:' "$report" || true
            echo
            awk '/^## Totals$/{f=1;next} f&&/^## /{exit} f' "$report" | grep -v '^legend:'
            echo
            echo "<sub>Measured on the merge of this head into the base branch, and"
            echo "re-measured on every push. <a href=\"$RUN_URL\">Full report and JSON"
            echo "artifact</a>.</sub>"
          } > comment.md

          # A comment that trips the API limit is worse than a trimmed one.
          if [ "$(wc -c < comment.md)" -gt 65000 ]; then
            head -c 64000 comment.md > comment.trimmed
            printf '\n\n<sub>Truncated; see the full report.</sub>\n' >> comment.trimmed
            mv comment.trimmed comment.md
          fi

      # Re-measuring a pull request replaces its summary instead of adding
      # another one, so the thread keeps exactly one current comment.
      - name: Upsert the sticky comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.target.outputs.pr }}
        run: |
          set -euo pipefail
          existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq 'map(select(.body | startswith("<!-- liveness-primer-summary -->"))) | first | .id // empty')
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@comment.md
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@comment.md
          fi
